name: CI

on:
  push:
  pull_request:

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required repository files
        run: |
          test -f README.md
          test -f .env.example
          test -f docs/REQUIREMENTS.md
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint Python
        run: |
          python -m pip install ruff
          ruff check services packages tests
      - name: Run shared event-schema unit tests
        run: docker compose --profile test run --build --rm unit-tests
      - name: Run local-stack integration checks
        run: docker compose --profile integration run --build --rm integration-tests

  web-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=moderate
