name: ev-fleet-intelligence

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evfleet}
      POSTGRES_USER: ${POSTGRES_USER:-evfleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PUBLISHED_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-evfleet}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in .env}
    ports:
      - "${MONGO_PUBLISHED_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PUBLISHED_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "${KAFKA_PUBLISHED_PORT:-19092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${MQTT_PUBLISHED_PORT:-11883}:1883"
    volumes:
      - ./infra/docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DEMO_OPERATOR_EMAIL: ${DEMO_OPERATOR_EMAIL:-operator@demo.local}
      DEMO_OPERATOR_PASSWORD: ${DEMO_OPERATOR_PASSWORD:?Set DEMO_OPERATOR_PASSWORD in .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-evfleet}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-evfleet}
      POSTGRES_DB: ${POSTGRES_DB:-evfleet}
      POSTGRES_USER: ${POSTGRES_USER:-evfleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-evfleet}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in .env}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      REDIS_PORT: 6379
      REDIS_HOST: redis
      SEED_VEHICLE_COUNT: ${SEED_VEHICLE_COUNT:-100000}
      SIMULATOR_SEED: ${SIMULATOR_SEED:-20260930}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MQTT_HOST: mosquitto
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 10

  simulator:
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
    environment:
      SIMULATOR_MODE: ${SIMULATOR_MODE:-DEMO_MODE}
      SIMULATOR_SEED: ${SIMULATOR_SEED:-20260930}
      SIMULATOR_VEHICLE_COUNT: ${SIMULATOR_VEHICLE_COUNT:-100000}
      SIMULATOR_EVENTS_PER_SECOND: ${SIMULATOR_EVENTS_PER_SECOND:-20}
      SIMULATOR_DUPLICATE_RATE: ${SIMULATOR_DUPLICATE_RATE:-0.01}
      SIMULATOR_OUT_OF_ORDER_RATE: ${SIMULATOR_OUT_OF_ORDER_RATE:-0.02}
      SIMULATOR_MALFORMED_RATE: ${SIMULATOR_MALFORMED_RATE:-0}
      SIMULATOR_UNKNOWN_EVENT_RATE: ${SIMULATOR_UNKNOWN_EVENT_RATE:-0}
      SIMULATOR_FAULT_RATE: ${SIMULATOR_FAULT_RATE:-0.001}
      SIMULATOR_BURST_MULTIPLIER: ${SIMULATOR_BURST_MULTIPLIER:-3}
      SIMULATOR_BURST_INTERVAL_SECONDS: ${SIMULATOR_BURST_INTERVAL_SECONDS:-900}
      SIMULATOR_BURST_DURATION_SECONDS: ${SIMULATOR_BURST_DURATION_SECONDS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mosquitto:
        condition: service_healthy
      redis:
        condition: service_healthy

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC_FILTER: evfleet/telemetry/v1/#
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TELEMETRY_TOPIC: evfleet.telemetry.v1
      KAFKA_DEAD_LETTER_TOPIC: evfleet.telemetry.dlq.v1
      INGESTION_WORKERS: ${INGESTION_WORKERS:-4}
      INGESTION_QUEUE_CAPACITY: ${INGESTION_QUEUE_CAPACITY:-10000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      mosquitto:
        condition: service_healthy
      kafka:
        condition: service_healthy

  stream-processor:
    build:
      context: .
      dockerfile: services/stream_processor/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TELEMETRY_TOPIC: evfleet.telemetry.v1
      KAFKA_CONSUMER_GROUP: evfleet-stream-processor-v1
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-evfleet}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-evfleet}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-evfleet}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in .env}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  unit-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: services/api/Dockerfile.test
    command:
      - pytest
      - -q
      - /app/tests/unit
      - --cov=evfleet_processor.domain
      - --cov=evfleet_ingestion.topics
      - --cov=ev_fleet_simulator.generator
      - --cov=charging
      - --cov=security
      - --cov-report=term-missing
      - --cov-report=xml:/reports/coverage.xml
    volumes:
      - ./docs/evidence:/reports

  integration-tests:
    profiles: ["integration"]
    build:
      context: .
      dockerfile: services/api/Dockerfile.test
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-evfleet}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-evfleet}
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-evfleet}:${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in .env}@mongodb:27017/?authSource=admin
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DEMO_OPERATOR_EMAIL: ${DEMO_OPERATOR_EMAIL:-operator@demo.local}
      DEMO_OPERATOR_PASSWORD: ${DEMO_OPERATOR_PASSWORD:?Set DEMO_OPERATOR_PASSWORD in .env}
      API_BASE_URL: http://api:8000
    command: ["pytest", "-q", "/app/tests/integration"]
    depends_on:
      api:
        condition: service_healthy
      simulator:
        condition: service_started
      stream-processor:
        condition: service_started

  k6:
    profiles: ["load"]
    image: grafana/k6:0.54.0
    command: ["run", "--summary-export", "/reports/k6-api-summary.json", "/scripts/api.js"]
    environment:
      API_BASE_URL: http://api:8000/api/v1
      LOAD_DURATION: ${LOAD_DURATION:-60s}
      LOAD_RATE: ${LOAD_RATE:-5}
      LOAD_PREALLOCATED_VUS: ${LOAD_PREALLOCATED_VUS:-10}
      LOAD_MAX_VUS: ${LOAD_MAX_VUS:-20}
      K6_SUMMARY_TREND_STATS: avg,min,med,max,p(90),p(95),p(99)
      DEMO_OPERATOR_EMAIL: ${DEMO_OPERATOR_EMAIL:-operator@demo.local}
      DEMO_OPERATOR_PASSWORD: ${DEMO_OPERATOR_PASSWORD:?Set DEMO_OPERATOR_PASSWORD in .env}
    volumes:
      - ./infra/load/api.js:/scripts/api.js:ro
      - ./docs/evidence:/reports
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  kafka_data:
  mosquitto_data:
  mosquitto_log:
  prometheus_data:
  grafana_data:
